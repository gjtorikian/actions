name: Release and publish

on:
  workflow_call:
    secrets:
      gh_token:
        required: true
    outputs:
      version:
        description: "Full version number"
        value: ${{ jobs.release.outputs.version }}
      major:
        description: "Major version number"
        value: ${{ jobs.release.outputs.major }}
    inputs:
      version_filepath:
        default: package.json
        type: string
      prepare:
        required: false
        default: false
        type: boolean
      release:
        required: false
        default: false
        type: boolean
      build_dist:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  create-release-pr:
    if: ${{ inputs.prepare }}
    runs-on: ubuntu-latest
    outputs:
      pending_release: ${{ steps.release-please.outputs.pending_release }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Actions Auto Build"

      # release-please logic: scan conventional commits since the last tag,
      # compute the next version, bump the version in package.json, and prepend
      # a grouped changelog entry. Only `feat`/`fix`/`perf`/`BREAKING` commits
      # trigger a release; other types are listed under "Miscellaneous Chores".
      - name: Compute next release (release-please logic)
        id: release-please
        uses: gjtorikian/actions/release-please@main
        with:
          mode: compute
          version_filepath: ${{ inputs.version_filepath }}
          version_type: node

      - name: Set up Node.js
        if: ${{ steps.release-please.outputs.should_release == 'true' && inputs.build_dist }}
        uses: gjtorikian/actions/setup-languages/node@main

      - name: Build dist
        if: ${{ steps.release-please.outputs.should_release == 'true' && inputs.build_dist }}
        run: npm run build

      - name: Create release PR
        if: ${{ steps.release-please.outputs.should_release == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "[skip test] release v${{ steps.release-please.outputs.next_version }}"
          title: "[skip test] Release v${{ steps.release-please.outputs.next_version }}"
          body: >
            This is an automated release PR (release-please logic). It bumps the
            version to v${{ steps.release-please.outputs.next_version }} and
            updates CHANGELOG.md from conventional commits.<br/><br/>
            Upon merging, a tag and GitHub release will be created and the package
            will be published to npm.<br/><br/>
            Due to security considerations, PRs created by GitHub Actions cannot
            be merged automatically. Please review the changes and merge the PR.<br/><br/>
            If you require the test suites to run, you can close the PR and reopen
            it to trigger those workflows.
          delete-branch: true
          labels: release
          branch: release-please

  # Runs on the push that lands a merged release PR (compute detects the
  # version file ahead of the last tag and signals pending_release), or on an
  # explicit release input (e.g. workflow_dispatch). Callers must not release
  # from pull_request_target: npm's trusted-publishing OIDC exchange rejects
  # tokens from that trigger, so publish would fail with a misleading E404.
  release:
    needs: create-release-pr
    if: ${{ !cancelled() && (inputs.release || needs.create-release-pr.outputs.pending_release == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: gjtorikian/actions/setup-languages/node@main

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT

      # Idempotent so a re-run or manual dispatch can resume a partial release.
      - name: Create and push tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Extract release notes
        id: notes
        uses: gjtorikian/actions/release-please@main
        with:
          mode: notes
          version: ${{ steps.version.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  publish:
    needs: release
    # Explicit condition: skipped jobs propagate transitively through needs
    # chains, so when create-release-pr is skipped (workflow_dispatch), the
    # default success() would skip publish even though release succeeded.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Uses actions/setup-node directly (not setup-languages/node) because
      # publish needs `registry-url` to configure npm auth, which the shared
      # setup action does not set. With the workflow-level `id-token: write`,
      # `npm publish --provenance` performs npm trusted publishing: it
      # exchanges the GitHub OIDC token for a short-lived npm publish token,
      # so no NPM_TOKEN secret is needed. The package must be configured as a
      # trusted publisher on npm (repo + this workflow file) or this fails.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public